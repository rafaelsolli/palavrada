# Publica o jogo no GitHub Pages.
#
# Requer, uma única vez: Settings → Pages → Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Testes
        working-directory: app
        run: npm test

      - name: Typecheck
        working-directory: app
        run: npm run check

      - name: Build
        working-directory: app
        run: npm run build

      - name: Montar artefato
        run: |
          mkdir -p site
          cp -r app/dist/. site/
          # CNAME precisa estar na raiz do artefato ou o domínio custom cai.
          cp CNAME site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Navegador de verdade: confere que o bundle monta, que o canvas desenha e que
  # o layout cabe na tela — nada disso o jsdom enxerga.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Cache do navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Instalar o Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Testes em navegador
        working-directory: app
        run: npm run test:e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
