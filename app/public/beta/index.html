<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>PalavRada 🌊</title>
    <!--
      Durante a reescrita, a versão nova viveu em /beta/ enquanto a antiga
      ocupava a raiz. A nova virou a oficial; este redirecionamento mantém vivos
      os links e favoritos daquele período.
    -->
    <link rel="canonical" href="/" />
    <meta name="robots" content="noindex" />
    <script>
      // Preserva ?w= e ?x=, que identificam o desafio.
      location.replace('/' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body style="background: #080d18; color: #4a6080; font-family: sans-serif">
    <p style="padding: 24px">
      O PalavRada agora fica em <a href="/" style="color: #3b82f6">palavrada.com.br</a>.
    </p>
  </body>
</html>
